topic_name: "AI, psychotherapy, and therapist/client experiences"

digest_size: 7
days_back: 180
max_results_per_query: 20

slot_targets:
  direct_relevance: 3
  broader_field: 2
  psychoanalytic_perspective: 1
  exploratory_adjacent: 1

required_topic_terms:
  - "artificial intelligence"
  - "generative AI"
  - "generative artificial intelligence"
  - "ChatGPT"
  - "large language model"
  - "LLM"
  - "AI chatbot"
  - "chatbot"
  - "AI companion"
  - "companion AI"
  - "synthetic relationship"
  - "human-machine"
  - "human AI"

queries:
  - lane: direct_relevance
    text: "psychotherapists patients using ChatGPT therapy"

  - lane: direct_relevance
    text: "therapists perspectives generative AI psychotherapy"

  - lane: direct_relevance
    text: "client use ChatGPT psychotherapy therapist"

  - lane: direct_relevance
    text: "therapeutic relationship generative AI psychotherapy"

  - lane: direct_relevance
    text: "mental health professionals adoption generative AI psychotherapy"

  - lane: broader_field
    text: "artificial intelligence mental health psychotherapy"

  - lane: broader_field
    text: "AI chatbots mental health therapy users"

  - lane: broader_field
    text: "generative AI mental health clinical practice"

  - lane: broader_field
    text: "attitudes toward AI in mental health care survey"

  - lane: broader_field
    text: "ChatGPT mental health users therapy survey"

  - lane: psychoanalytic_perspective
    text: "psychoanalysis artificial intelligence psychotherapy"

  - lane: psychoanalytic_perspective
    text: "psychodynamic artificial intelligence chatbot"

  - lane: psychoanalytic_perspective
    text: "psychoanalytic perspective artificial intelligence human machine relationship"

  - lane: exploratory_adjacent
    text: "anthropomorphism chatbot mental health"

  - lane: exploratory_adjacent
    text: "self-disclosure artificial intelligence chatbot"

  - lane: exploratory_adjacent
    text: "emotional attachment artificial intelligence chatbot"

  - lane: exploratory_adjacent
    text: "AI companion intimacy self disclosure"

categories:
  direct_relevance:
    label: "Directly relevant to the thesis"
    description: >
      Work closest to the thesis topic: therapists, psychotherapists, clinicians,
      clients, or patients encountering generative AI in relation to psychotherapy.
      This includes therapist attitudes, trust and distrust, clinical uncertainty,
      patient/client use of ChatGPT or similar tools, implications for the therapeutic
      relationship, therapeutic alliance, clinical frame, disclosure, responsibility,
      and how AI becomes part of psychotherapy practice.
    lane_bonus: 8
    term_weight: 3
    terms:
      - "psychotherapist"
      - "psychotherapists"
      - "therapist"
      - "therapists"
      - "clinician"
      - "clinicians"
      - "mental health professionals"
      - "client use"
      - "patient use"
      - "patients using"
      - "clients using"
      - "psychotherapy"
      - "therapy"
      - "therapeutic relationship"
      - "therapeutic alliance"
      - "clinical practice"
      - "clinical decision"
      - "trust"
      - "distrust"
      - "ChatGPT"
      - "generative AI"
      - "generative artificial intelligence"
      - "large language model"

  broader_field:
    label: "Broader field orientation"
    description: >
      Work that may not map directly onto the thesis question but helps build
      orientation in the wider field of AI and mental health: how people use AI
      for support, what risks and benefits are discussed, how clinicians and users
      evaluate AI tools, what quantitative evidence exists, and how the field is
      developing around digital mental health, therapy, counselling, safety, ethics,
      and implementation.
    lane_bonus: 5
    term_weight: 2
    terms:
      - "mental health"
      - "digital mental health"
      - "AI chatbot"
      - "chatbot"
      - "artificial intelligence"
      - "generative artificial intelligence"
      - "clinical ethics"
      - "ethics"
      - "risk"
      - "safety"
      - "implementation"
      - "user experience"
      - "help-seeking"
      - "self-help"
      - "counseling"
      - "counselling"
      - "survey"
      - "questionnaire"
      - "cross-sectional"
      - "longitudinal"
      - "experiment"
      - "randomized"
      - "randomised"
      - "mixed methods"
      - "prevalence"
      - "predictors"
      - "attitudes"
      - "acceptance"
      - "effectiveness"

  psychoanalytic_perspective:
    label: "Psychoanalytic perspective"
    description: >
      Psychoanalytic, psychodynamic, or theoretically adjacent work that may help
      think about AI through concepts such as transference, countertransference,
      object relations, fantasy, embodiment, intimacy, dependency, attachment,
      idealization, selfobject-like functions, symbolic meaning, and human-machine
      relations. These texts do not have to be empirical if they offer a useful
      conceptual angle.
    lane_bonus: 7
    term_weight: 3
    terms:
      - "psychoanalysis"
      - "psychoanalytic"
      - "psychodynamic"
      - "transference"
      - "countertransference"
      - "object relations"
      - "selfobject"
      - "attachment"
      - "fantasy"
      - "symbolization"
      - "embodiment"
      - "intimacy"
      - "dependency"
      - "human-machine"
      - "human AI relationship"
      - "relational"

  exploratory_adjacent:
    label: "Exploratory perspectives"
    description: >
      Deliberately broader findings that may open a new direction rather than
      directly support the thesis: anthropomorphism of chatbots, self-disclosure
      to AI, emotional support, AI companions, digital intimacy, loneliness,
      trust in AI, epistemic authority, advice-seeking, emotion regulation,
      vulnerability, and human-computer interaction around care or relationships.
    lane_bonus: 4
    term_weight: 2
    terms:
      - "anthropomorphism"
      - "anthropomorphic"
      - "self-disclosure"
      - "disclosure"
      - "emotional support"
      - "emotional attachment"
      - "companion chatbot"
      - "AI companion"
      - "trust in AI"
      - "intimacy"
      - "loneliness"
      - "emotion regulation"
      - "advice-seeking"
      - "epistemic trust"
      - "vulnerability"
      - "human-computer interaction"

hard_exclude_terms:
  - "radiology"
  - "pathology image classification"
  - "dermatology image classification"
  - "ophthalmology image classification"
  - "surgery"
  - "hospital billing"
  - "customer service chatbot"
  - "programming benchmark"

soft_downrank_terms:
  - "medical education"
  - "student assessment"
  - "administrative documentation"
  - "electronic health record"
  - "diagnostic accuracy only"
  - "triage without psychotherapy"

soft_downrank_penalty: 2